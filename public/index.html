<!DOCTYPE html>
<html>
<head>
  <title>Convertidor XML-JSON</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin: 10px 0;
      padding: 10px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Convertidor XML - JSON</h1>
  
  <h2>Entrada</h2>
  <textarea id="input" placeholder="Pega XML o JSON"></textarea>
  
  <div>
    <button id="btn">XML → JSON</button>
    <button id="btnxml">JSON → XML</button>
  </div>
  
  <h2>Salida</h2>
  <textarea id="output" readonly></textarea>

  <script src="app.js"></script>
</body>
</html>
